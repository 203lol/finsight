[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finsight"
version = "1.0.0"
description = "Detect recurring payments, forecast your balance, and get money recommendations from a transaction history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lokesh Pandit" }]
keywords = ["finance", "transactions", "forecasting", "budgeting", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
finsight = "finsight.cli:main"

[project.urls]
Homepage = "https://github.com/203lol/finsight"
Repository = "https://github.com/203lol/finsight"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
